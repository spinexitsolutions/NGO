# Local production-like stack: PostgreSQL + the app. For development use `npm run dev`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ngo
      POSTGRES_PASSWORD: ngo
      POSTGRES_DB: ngo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngo"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]
    env_file: server/.env
    environment:
      DATABASE_URL: postgresql://ngo:ngo@db:5432/ngo
      NODE_ENV: production
      PUBLIC_SITE_URL: http://localhost:4000
      COOKIE_SECURE: "false"
    volumes:
      - uploads:/app/server/uploads
      - private:/app/server/private-uploads
volumes:
  pgdata:
  uploads:
  private:
