# Production-like single container. The database is a SQLite file kept on the `data` volume.
services:
  app:
    build: .
    ports: ["4000:4000"]
    env_file: server/.env
    environment:
      DATABASE_URL: file:../data/ngo.db
      NODE_ENV: production
      PUBLIC_SITE_URL: http://localhost:4000
      COOKIE_SECURE: "false"
    volumes:
      - data:/app/server/data
      - uploads:/app/server/uploads
      - private:/app/server/private-uploads
volumes:
  data:
  uploads:
  private:
